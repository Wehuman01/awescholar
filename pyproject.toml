[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "awescholar"
version = "0.3.7"
description = "Automated scientific literature discovery and curation for Awesome lists"
requires-python = ">=3.11"
license = "MPL-2.0"
dependencies = [
    "litellm>=1.86",
    "semanticscholar>=0.12",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# ruff is pinned exactly: it gates CI/release, so its verdict must be reproducible
dev = ["pytest", "ruff==0.16.5"]

[tool.ruff]
target-version = "py311"
line-length = 100

[project.scripts]
awescholar = "awescholar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
awescholar = ["templates/**/*"]
